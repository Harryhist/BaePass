<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ '#fdf9f3' if theme == 'romantic' else '#fafaf7' }}">
  <meta name="robots" content="noindex, nofollow">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}BaePass{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=asset_v) }}">
</head>
<body>
  {% include "_icons.html" %}
  <div class="page">
    <header class="topbar {% block topbar_class %}{% endblock %}">
      {% include "_toggle.html" %}
      {% block topbar_right %}{% endblock %}
    </header>
    <main class="stage">
      {% block body %}{% endblock %}
    </main>
    <footer class="foot"><span class="r">Made with love, just for you 💕</span></footer>
  </div>
  <script src="{{ url_for('static', filename='js/theme.js', v=asset_v) }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
